<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Website</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="site-container">
        <!-- Logo -->
        <header class="logo-area">
            <h1>♡ Logo ♡</h1>
        </header>

        <!-- Top Banner -->
        <div class="info-graphics-area">
            <p>Welcome to my personal site ✨</p>
        </div>

        <!-- Top Navigation Bar (Populated via nav.js) -->
        <nav id="top-nav" class="primary-nav-area"></nav>

        <!-- Left Sidebar -->
        <aside class="left-sidebar">
            <h3>Quick Links</h3>
            <p>Welcome!</p>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="hero-image">
                ✦ Hero Image Area ✦
            </div>
            <h2>Main Content</h2>
            <p>Write your main body content here.</p>
        </main>

        <!-- Sticky Sidebar -->
        <aside class="sticky-sidebar">
            <h3>Updates</h3>
            <ul>
                <li>News & updates</li>
                <li>Social links</li>
            </ul>
        </aside>

        <!-- Footer -->
        <footer class="footer-area">
            <p>&copy; 2026 | Designed with ♡</p>
        </footer>
    </div>

    <script src="nav.js"></script>
</body>
</html>
