<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Website</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Container wrapping the classic layout -->
  <div class="layout-container">
    
    <!-- Header -->
    <header class="header-box">
      <h1>Header</h1>
    </header>

    <!-- Navigation Menu (Populated dynamically via navbar.js or manually) -->
    <nav class="nav-box" id="main-nav"></nav>

    <!-- Content Area (3 Columns) -->
    <aside class="content-box side-content">
      <h2>Content</h2>
      <p>Left sidebar content...</p>
    </aside>

    <main class="content-box main-content">
      <h2>Main Content</h2>
      <p>Primary page content goes here...</p>
    </main>

    <aside class="content-box side-content">
      <h2>Content</h2>
      <p>Right sidebar content...</p>
    </aside>

    <!-- Footer -->
    <footer class="footer-box">
      <p>Footer</p>
    </footer>

  </div>

  <script src="navbar.js"></script>
</body>
</html>
