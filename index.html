<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Website</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Layout Container -->
  <div class="layout-container">
    
    <!-- Header -->
    <header class="box header-box">
      <h1>Header</h1>
    </header>

    <!-- Nav Bar (Populated dynamically via navbar.js) -->
    <nav class="box nav-box" id="main-nav"></nav>

    <!-- Sidebar / Aside -->
    <aside class="box aside-box">
      <h2>Aside</h2>
      <p>Sidebar content goes here...</p>
    </aside>

    <!-- Main Section -->
    <section class="box section-box">
      <h2>Section</h2>
      <p>Main body/section content goes here...</p>
    </section>

    <!-- Footer -->
    <footer class="box footer-box">
      <p>Footer</p>
    </footer>

  </div>

  <script src="navbar.js"></script>
</body>
</html>
